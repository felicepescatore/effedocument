# eFFe Document - regole di protezione per nginx
#
# nginx ignora i file .htaccess e web.config: queste regole vanno inserite
# nel blocco "server { ... }" del sito, PRIMA del blocco che passa i file
# .php a PHP-FPM (location ~ \.php$).
#
# Se l'applicazione e' in una sottocartella (es. /effedocument/), aggiungi
# la sottocartella all'inizio di ogni percorso: /effedocument/common/config/ ...

# File nascosti (.htaccess, .user.ini, .git ...)
location ~ /\. {
    deny all;
}

# File di configurazione per IIS
location ~ /web\.config$ {
    deny all;
}

# Credenziali del database
location ^~ /common/config/ {
    deny all;
}

# Log delle operazioni
location ^~ /log/ {
    deny all;
}

# Allegati caricati dagli utenti: si scaricano, ma nessuno script viene eseguito.
# "^~" impedisce che la richiesta arrivi al blocco PHP.
location ^~ /documenti_allegati/ {
    location ~* \.(php\d?|phtml|pht|phps|phar|inc|cgi|pl|py|sh|asp|aspx|jsp|shtml)$ {
        deny all;
    }
    add_header X-Content-Type-Options "nosniff" always;
}
