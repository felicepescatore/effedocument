; eFFe Document - impostazioni PHP richieste (PHP-FPM / CGI)
; Le pagine stampano HTML prima di session_start() e degli header del PDF:
; serve il buffering dell'output.
output_buffering = 4096
; Pagine e database sono in ISO-8859-1. Da PHP 5.6 il default e' UTF-8 e
; l'header HTTP prevale sul <meta>: senza questa riga le lettere accentate
; risultano corrotte.
default_charset = "ISO-8859-1"
